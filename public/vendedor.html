<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Area do vendedor - TDrive PRO</title>
<link rel="stylesheet" href="/tema.css">
<script src="/tema.js"></script>
<style>
:root{--card:#121c30;--card2:#18243d;--line:#243352;--tx:#e8eefc;--tx2:#93a4c4;--ac:#3b82f6;--red:#ef4444;--yel:#f59e0b;--grn:#22c55e}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0b1220,#0e1626 340px);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 60px}
.topo{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.topo h1{font-size:19px;margin:0}
.topo .sub{color:var(--tx2);font-size:13px;margin-top:2px}
.bt{padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.bt:hover{border-color:var(--ac)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx2);margin:0 0 12px}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:28px}
.ferramenta{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--tx);display:block}
.ferramenta:hover{border-color:var(--ac)}
.ferramenta.pri{background:var(--ac);border-color:var(--ac)}
.ferramenta.pri b, .ferramenta.pri span{color:#fff}
.ferramenta b{display:block;font-size:15px;margin-bottom:3px}
.ferramenta span{font-size:12px;color:var(--tx2)}
.carregando{color:var(--tx2);font-size:13.5px}
.vazio{color:var(--tx2);font-size:13.5px;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center}
.ficha{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.linha{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.nome{font-weight:700;font-size:14px}
.meta{font-size:12px;color:var(--tx2)}
.badge{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11.5px;color:var(--tx2)}
</style>
</head>
<body>
<div class="wrap">
<div class="topo">
<div><h1 id="hOla">Ola</h1><div class="sub" id="hEmail"></div></div>
<button class="bt" id="bSair">Sair</button>
</div>

<h2>Ferramentas</h2>
<div class="hub">
<a class="ferramenta pri" href="/"><b>Enviar ficha</b><span>Colar dados e subir uma ficha nova</span></a>
<a class="ferramenta" href="/simulador.html"><b>Simulador</b><span>Calcular parcelas pro cliente</span></a>
<a class="ferramenta" href="/consorcio.html"><b>Consórcio</b><span>Indicar cliente pra carta de consórcio</span></a>
</div>

<h2>Minhas fichas</h2>
<div id="lista" class="carregando">Carregando...</div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
function badge(s){return '<span class="badge '+s+'">'+s+'</span>';}
function fmtData(d){try{return new Date(d).toLocaleString("pt-BR");}catch(e){return d;}}
fetch("/api/me").then(function(r){return r.json()}).then(function(j){
if(!j.usuario || j.usuario.role!=="vendedor"){ location.href="/vendedor/login"; return; }
$("hOla").textContent="Ola, "+j.usuario.nome;
$("hEmail").textContent=j.usuario.email;
carregarFichas();
}).catch(function(){ location.href="/vendedor/login"; });
function carregarFichas(){
fetch("/api/vendedor/fichas").then(function(r){return r.json()}).then(function(j){
var el=$("lista");
if(!j.success){ el.innerHTML='<div class="vazio">'+(j.message||"Nao consegui carregar")+'</div>'; return; }
if(!j.fichas.length){ el.innerHTML='<div class="vazio">Voce ainda nao enviou nenhuma ficha.</div>'; return; }
el.innerHTML=j.fichas.map(function(f){
return '<div class="ficha"><div class="linha"><div><div class="nome">'+(f.name||"-")+'</div><div class="meta">CPF '+(f.cpf||"-")+' - '+fmtData(f.criado_em)+'</div></div>'+badge(f.status)+'</div></div>';
}).join("");
}).catch(function(){ $("lista").innerHTML='<div class="vazio">Falha ao carregar.</div>'; });
}
$("bSair").onclick=function(){ fetch("/api/logout",{method:"POST"}).then(function(){ location.href="/vendedor/login"; }); };
</script>
</body>
</html>
