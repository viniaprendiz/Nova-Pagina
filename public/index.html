<!DOCTYPE html>
<html>
  <head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>TDrive Pro</title></head>
<body style='margin:0;padding:20px;font-family:sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center'>
<div id=app></div>div>
<script>
  const html=`<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>TDrive Pro v4.0</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Segoe UI,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:center}.container{background:white;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.2);max-width:650px;width:100%;padding:40px}h1{color:#333;font-size:28px;margin-bottom:10px}.subtitle{color:#666;margin-bottom:30px}.section{margin-bottom:30px}label{display:block;color:#555;font-weight:600;margin-bottom:10px}textarea{width:100%;height:120px;padding:12px;border:2px solid #ddd;border-radius:8px;font-family:monospace;font-size:13px}.btn{padding:12px 24px;border:none;border-radius:8px;font-weight:600;cursor:pointer;margin-top:10px;transition:all .3s}.btn-primary{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white}.btn-primary:hover{transform:translateY(-2px)}.btn-success{background:#10b981;color:white;text-decoration:none}.validation{margin-top:15px;padding:15px;border-radius:8px;display:none}.validation.show{display:block}.validation-success{background:#ecfdf5;border-left:4px solid #10b981;color:#047857}.validation-error{background:#fef2f2;border-left:4px solid #ef4444;color:#b91c1c}.data-preview{background:#f9fafb;padding:12px;border-radius:6px;margin-top:10px;font-size:13px}.confirmation{display:none;margin-top:30px;padding-top:30px;border-top:2px solid #eee}.confirmation.show{display:block}.success-box{background:#ecfdf5;padding:20px;border-radius:8px;border-left:4px solid #10b981;margin-bottom:20px}.success-box h2{color:#047857}.fandi-id{font-family:monospace;font-weight:600;color:#667eea;background:#f3f4f6;padding:8px 12px;border-radius:4px;margin-top:10px}.button-group{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}a.btn-success{display:inline-block}</style></head><body><div class=container><h1>🚀 TDrive Pro v4.0</h1><p class=subtitle>Automação Fandi</p><div class=section><label>Dados do cliente:</label><textarea id=cd placeholder='CPF: 281.453.458-04&#10;Nome: Beto Pedro&#10;Mãe: Maria Silva&#10;Telefone: (11) 99999-9999&#10;Salário: 5000&#10;CEP: 01310-100&#10;Endereço: Av. Paulista, 1000&#10;Bairro: Bela Vista'></textarea><button class=btn-primary onclick='w()'>📋 EXTRAIR E VALIDAR</button></div><div id=v class=validation></div><div id=c class=confirmation><div class=success-box><h2>✅ Dados Extraídos!</h2><div id=e class=data-preview></div><button class=btn-primary onclick='s()'>📤 ENVIAR PARA FANDI</button></div></div><div id=r class=confirmation></div></div><script>function w(){const i=document.getElementById('cd').value;const v=document.getElementById('v');const c=document.getElementById('c');const e=document.getElementById('e');const p={cpf:/cpf\s*:\s*([\d.\-]+)/i,name:/nome\s*:\s*([^\n]+)/i,mother:/m[aã]e\s*:\s*([^\n]+)/i,phone:/telefone\s*:\s*([^\n]+)/i,salary:/sal[aá]rio\s*:\s*([^\n]+)/i,cep:/cep\s*:\s*([^\n]+)/i,address:/endere[çc]o\s*:\s*([^\n]+)/i,neighborhood:/bairro\s*:\s*([^\n]+)/i};const x={};for(const[k,r]of Object.entries(p)){const m=i.match(r);x[k]=m?m[1].trim():''}const req=['cpf','name','mother','phone','salary','cep','address','neighborhood'];const miss=req.filter(f=>!x[f]);if(miss.length>0){v.className='validation show validation-error';v.innerHTML='<strong>❌ Faltando:</strong> '+miss.join(', ');c.classList.remove('show');return}v.className='validation show validation-success';v.innerHTML='<strong>✅ Sucesso!</strong>';let h='';const l={cpf:'CPF',name:'Nome',mother:'Mãe',phone:'Telefone',salary:'Salário',cep:'CEP',address:'Endereço',neighborhood:'Bairro'};for(const[k,val]of Object.entries(x)){h+='<div><span style="color:#999;font-size:12px">'+l[k]+':</span> <span style="color:#333;font-weight:500">'+val+'</span></div>'}e.innerHTML=h;c.classList.add('show');window.current=x;localStorage.setItem('last',JSON.stringify(x))}async function s(){if(!window.current)return;const btn=event.target;btn.disabled=true;try{const res=await fetch('/api/submit-fandi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(window.current)});const d=await res.json();if(d.success&&d.fandiId){const r=document.getElementById('r');r.innerHTML='<div class=success-box><h2>🎉 Enviado!</h2><p>ID:</p><div class=fandi-id>'+d.fandiId+'</div></div><div class=button-group><a href=https://jsl.fandi.com.br/operacao/monitor target=_blank class="btn btn-success">👁️ VER FANDI</a></div>';r.classList.add('show');localStorage.setItem('fandiId',d.fandiId)}else{alert('Erro: '+(d.error||'Inválido'))}}catch(e){alert('Erro: '+e.message)}finally{btn.disabled=false}}</script></body>body></html>\`;document.getElementById('app').innerHTML=html;
</script>
</body>
</html>
</script></title></head>
</html>
