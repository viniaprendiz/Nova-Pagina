<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TDrive Pro v2.0</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Segoe UI;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px}
    .container{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:20px}
    .header{background:#fff;padding:30px;border-radius:8px;margin-bottom:20px;box-shadow:0 4px 6px rgba(0,0,0,.1);text-align:center;grid-column:1/-1}
    .header h1{color:#667eea;font-size:2.5em}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin:20px 0}
    .stat-box{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:20px;border-radius:8px;text-align:center}
    .stat-box h3{font-size:2em}
    .sidebar{background:#fff;padding:20px;border-radius:8px;position:sticky;top:20px}
    .sidebar h2{color:#667eea;margin-bottom:15px}
    .client-item{background:#f5f5f5;padding:10px;margin-bottom:10px;border-radius:5px;border-left:4px solid #667eea;cursor:pointer}
    .main-content{background:#fff;padding:30px;border-radius:8px}
    .chat-container{display:flex;flex-direction:column;height:600px}
    .chat-messages{flex:1;overflow-y:auto;margin-bottom:20px;padding:15px;background:#f9f9f9;border-radius:5px}
    .message{margin-bottom:15px;padding:12px;border-radius:5px}
    .message.user{background:#667eea;color:#fff}
    .message.success{background:#d4edda}
    .message.error{background:#f8d7da}
    textarea{width:100%;padding:12px;border:2px solid #ddd;border-radius:5px;resize:none;height:80px}
    .btn{padding:12px 30px;border:none;border-radius:5px;cursor:pointer;font-weight:bold}
    .btn-primary{background:#667eea;color:#fff}
    .btn-success{background:#28a745;color:#fff}
    .toast{position:fixed;top:20px;right:20px;padding:15px;border-radius:5px;color:#fff;display:none;z-index:1000}
    .toast.success{background:#28a745}
    .toast.show{display:block}
    @media(max-width:900px){.container{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <div class="header">
      <h1>TDrive Pro v2.0 + Fandi</h1>
    <div class="stats">
    <div class="stat-box"><h3 id="total">0</h3><p>Fichas</p></div>div>
    </div>div>
    </div>div>
  
  <div class="container">
  <div class="sidebar">
  <h2>Clientes</h2>
  <div id="list"></div>div>
  </div>div>
  
  <div class="main-content">
  <div class="chat-container">
  <div class="chat-messages" id="chat"></div>div>
  <div style="display:flex;gap:10px">
  <textarea id="input" placeholder="Cole dados do cliente..."></textarea>
  <button class="btn btn-primary" onclick="extrair()">EXTRAIR</button>button>
  </div>div>
  </div>div>
  </div>div>
  </div>div>
  
  <div class="toast" id="toast"></div>div>
  
  <script>
    let clientes=[];
    function msg(t,tipo){const m=document.createElement('div');m.className='message '+tipo;m.textContent=t;document.getElementById('chat').appendChild(m);document.getElementById('chat').scrollTop=document.getElementById('chat').scrollHeight}
    async function extrair(){const texto=document.getElementById('input').value;if(!texto.trim()){alert('Cole dados!');return}msg('Analisando...','bot');try{const r=await fetch('/api/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:texto})});const res=await r.json();if(res.validation.valid){msg('OK!','success');const d=document.createElement('div');d.style='background:#f5f5f5;padding:15px;margin:15px 0';d.innerHTML='CPF: '+res.data.cpf+'<br>Nome: '+res.data.nome+'<br>Email: '+res.data.email+'<br>Renda: '+res.data.renda;document.getElementById('chat').appendChild(d);const btn=document.createElement('button');btn.className='btn btn-success';btn.textContent='ENVIAR PARA FANDI';btn.onclick=function(){enviar(res.data)};document.getElementById('chat').appendChild(btn)}else{msg('Faltam: '+res.validation.missing.join(', '),'error')}}catch(e){msg('Erro: '+e.message,'error')}}
    async function enviar(dados){msg('Enviando...','bot');try{const r=await fetch('/api/submit-fandi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(dados)});const res=await r.json();if(res.success){msg('Enviado! ID: '+res.fandi_id,'success');clientes.push(Object.assign({},dados,{fandi_id:res.fandi_id}));localStorage.setItem('clientes',JSON.stringify(clientes));document.getElementById('total').textContent=clientes.length;atualizar();document.getElementById('input').value=''}else{msg('Erro: '+res.message,'error')}}catch(e){msg('Erro: '+e.message,'error')}}
    function atualizar(){const lista=document.getElementById('list');lista.innerHTML='';for(let c of clientes){const d=document.createElement('div');d.className='client-item';d.innerHTML='<strong>'+c.nome+'</strong><br><small>'+c.cpf+'</small>';lista.appendChild(d)}}
    window.addEventListener('DOMContentLoaded',function(){const saved=localStorage.getItem('clientes');if(saved){clientes=JSON.parse(saved);atualizar();document.getElementById('total').textContent=clientes.length}msg('Bem-vindo ao TDrive Pro v2.0!','bot');msg('Cole dados do cliente','bot')})
      </script>
  </body>
</html>html>
  </script></p></h1>
  </body>
  </style></title>
  </head>
