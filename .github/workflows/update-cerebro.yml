name: Auto-Update CÉREBRO

on:
  push:
      branches: [main]
          paths-ignore:
                - '.github/**'
                      - 'README.md'

                      jobs:
                        update-cerebro:
                            runs-on: ubuntu-latest
                                steps:
                                      - uses: actions/checkout@v3

                                                  - name: Get latest commit
                                                          id: commit
                                                                  run: |
                                                                            echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
                                                                                      echo "msg=$(git log -1 --pretty=%B)" >> $GITHUB_OUTPUT
                                                                                                echo "author=$(git log -1 --pretty=%an)" >> $GITHUB_OUTPUT
                                                                                                          echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT
                                                                                                                
                                                                                                                      - name: Update CÉREBRO gist
                                                                                                                              uses: exetere/create-gist@v1
                                                                                                                                      with:
                                                                                                                                                gist_id: d10df965509ce4dfc71d533eb14c230c
                                                                                                                                                          gist_description: 'TDRIVE-SAAS Auto-updated Knowledge Base'
                                                                                                                                                                    gist_file_name: 'MEMORIA-TDRIVE-AUTOEVOL.md'
                                                                                                                                                                              file_content: |
                                                                                                                                                                                          # TDRIVE-SAAS v9.0 - AUTO-EVOLVING SYSTEM
                                                                                                                                                                                                      **Last Update**: ${{ steps.commit.outputs.date }}
                                                                                                                                                                                                                  **Commit**: ${{ steps.commit.outputs.sha }}
                                                                                                                                                                                                                              **Author**: ${{ steps.commit.outputs.author }}
                                                                                                                                                                                                                                          **Message**: ${{ steps.commit.outputs.msg }}
                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                  ## SISTEMA VIVO E AUTO-ALIMENTADO
                                                                                                                                                                                                                                                                              Este documento é atualizado automaticamente a cada push no repositório.
                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                      ### Status do Deployment
                                                                                                                                                                                                                                                                                                                  - Site: https://paginaexemplo.onrender.com
                                                                                                                                                                                                                                                                                                                              - Repo: https://github.com/viniaprendiz/Nova-Pagina
                                                                                                                                                                                                                                                                                                                                          - Status: ✅ ATIVO E AUTO-EVOLUINDO
                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                  ### Última Evolução
                                                                                                                                                                                                                                                                                                                                                                              **Timestamp**: ${{ steps.commit.outputs.date }}
                                                                                                                                                                                                                                                                                                                                                                                          **Autor da Mudança**: ${{ steps.commit.outputs.author }}
                                                                                                                                                                                                                                                                                                                                                                                                      **Descrição**: ${{ steps.commit.outputs.msg }}
                                                                                                                                                                                                                                                                                                                                                                                                                  
                                                                                                                                                                                                                                                                                                                                                                                                                              ### Próximos Passos (Inteligência Retrroalimentativa)
                                                                                                                                                                                                                                                                                                                                                                                                                                          1. Revisar alterações mais recentes
                                                                                                                                                                                                                                                                                                                                                                                                                                                      2. Executar testes de otimização
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  3. Verificar performance do Render
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              4. Escalar para primeiros clientes
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          5. Implementar Stripe de forma limpa
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ### Comando para Regenerar Este Arquivo
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ```bash
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          git log -1 --pretty=format:"%ai %an: %s" && npm run generate-docs
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      ```
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              env:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
