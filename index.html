<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 TDrive Automação - Fandi Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .status {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #333;
        }

        .status.online {
            border-left-color: #10b981;
            background: #f0fdf4;
        }

        .status.offline {
            border-left-color: #ef4444;
            background: #fef2f2;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: #f9f9ff;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }

        .resultado.sucesso {
            display: block;
            background: #f0fdf4;
            border: 2px solid #10b981;
            color: #065f46;
        }

        .resultado.erro {
            display: block;
            background: #fef2f2;
            border: 2px solid #ef4444;
            color: #7f1d1d;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin-top: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info {
            background: #fffbeb;
            border: 2px solid #fbbf24;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            color: #92400e;
            margin-top: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Automação Fandi</h1>
            <p>TDrive - Preenchimento automático de fichas</p>
        </div>

        <div class="status online" id="status">
            ✅ Servidor online e pronto!
        </div>

        <form id="form">
            <div class="form-group">
                <label>CPF do Cliente</label>
                <input type="text" name="cpf" placeholder="000.000.000-00" required>
            </div>

            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" name="nome" placeholder="João Silva" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Data de Nascimento</label>
                    <input type="text" name="data_nascimento" placeholder="DD/MM/YYYY" required>
                </div>
                <div class="form-group">
                    <label>Celular</label>
                    <input type="text" name="celular" placeholder="(11) 98765-4321" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Valor do Veículo</label>
                    <input type="text" name="valor" placeholder="94990" required>
                </div>
                <div class="form-group">
                    <label>Quilometragem</label>
                    <input type="text" name="km" placeholder="59062" required>
                </div>
            </div>

            <button type="submit" id="btn-enviar">📤 Enviar para Fandi</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processando automação...</p>
        </div>

        <div class="resultado" id="resultado"></div>

        <div class="info">
            <strong>ℹ️ Como usar:</strong><br>
            1. Preencha os dados do cliente<br>
            2. Clique em "Enviar para Fandi"<br>
            3. Aguarde a automação ser concluída<br>
            4. A ficha será preenchida automaticamente no Fandi
        </div>
    </div>

    <script>
        const form = document.getElementById('form');
        const btnEnviar = document.getElementById('btn-enviar');
        const loading = document.getElementById('loading');
        const resultado = document.getElementById('resultado');
        const status = document.getElementById('status');

        // Verificar status do servidor
        async function verificarStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                status.classList.add('online');
                status.textContent = '✅ Servidor online e pronto!';
            } catch (error) {
                status.classList.remove('online');
                status.classList.add('offline');
                status.textContent = '❌ Servidor offline';
            }
        }

        // Enviar formulário
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                cpf: document.querySelector('[name="cpf"]').value,
                nome: document.querySelector('[name="nome"]').value,
                data_nascimento: document.querySelector('[name="data_nascimento"]').value,
                celular: document.querySelector('[name="celular"]').value,
                valor: document.querySelector('[name="valor"]').value,
                km: document.querySelector('[name="km"]').value
            };

            btnEnviar.disabled = true;
            loading.classList.add('show');
            resultado.style.display = 'none';

            try {
                const response = await fetch('/api/preencherFandi', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    resultado.classList.remove('erro');
                    resultado.classList.add('sucesso');
                    resultado.innerHTML = `
                        <strong>✅ Sucesso!</strong><br>
                        Ficha de ${data.cliente} preenchida com sucesso!<br>
                        CPF: ${data.cpf}
                    `;
                    form.reset();
                } else {
                    resultado.classList.remove('sucesso');
                    resultado.classList.add('erro');
                    resultado.innerHTML = `
                        <strong>❌ Erro</strong><br>
                        ${data.message}
                    `;
                }

                resultado.style.display = 'block';
            } catch (error) {
                resultado.classList.remove('sucesso');
                resultado.classList.add('erro');
                resultado.innerHTML = `
                    <strong>❌ Erro na conexão</strong><br>
                    ${error.message}
                `;
                resultado.style.display = 'block';
            } finally {
                btnEnviar.disabled = false;
                loading.classList.remove('show');
            }
        });

        // Verificar status ao carregar
        verificarStatus();
        setInterval(verificarStatus, 30000); // Verificar a cada 30 segundos
    </script>
</body>
</html>
